<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BZARLU | Official</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
      background: url('background.jpg') no-repeat center center fixed;  /* CHANGE THIS if your bg file is named differently, e.g., bg.png or images/background.jpg */
      background-size: cover;
      background-attachment: fixed;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .logo {
      max-width: 300px;  /* Adjust size as needed */
      margin: 30px auto 20px;
      display: block;
    }
    h1 {
      color: #ff6600;  /* Orange to match your vibe */
      margin: 10px 0;
    }
    .video-section {
      margin: 50px 0;
      padding: 30px;
      background: rgba(0, 0, 0, 0.7);  /* Semi-transparent dark box to make video pop over bg */
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    iframe {
      width: 100%;
      max-width: 800px;
      height: 450px;
      border: none;
      border-radius: 10px;
    }
    .social-links {
      margin: 50px 0;
    }
    .social-links a {
      color: #fff;
      text-decoration: none;
      margin: 0 20px;
      font-size: 1.3em;
    }
    .social-links a:hover {
      color: #ff6600;
    }
    footer {
      margin-top: 80px;
      font-size: 0.9em;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Your logo (uploaded to repo root or adjust path) -->
    <img src="logo.png" alt="BZARLU Logo" class="logo">

    <h1>BZARLU</h1>
    <p>Official Site – Music, Drops, Vibes</p>

    <!-- The Dream video embed in the middle -->
    <div class="video-section">
      <h2>The Dream 💔</h2>
      <p>Emotional Liquid Drum & Bass – The only place we still meet...</p>
      <iframe src="https://www.youtube.com/embed/w0ItwwiCf8k" title="The Dream by BZARLU" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <div class="social-links">
      <p>Follow me on social media:</p>
      <a href="https://x.com/bzarlu1" target="_blank">X (@bzarlu1)</a>
      <a href="https://www.tiktok.com/@bzarlu_official" target="_blank">TikTok (@bzarlu_official)</a>
      <a href="https://www.youtube.com/@bzarlu" target="_blank">YouTube (@bzarlu)</a>
    </div>

    <footer>
      © 2026 Bzarlu – All Rights Reserved
    </footer>
  </div>
</body>
</html>
